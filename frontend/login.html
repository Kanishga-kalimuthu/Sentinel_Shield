
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelShield | Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #071525, #102d48);
            color: white;
        }

        .login-box {
            width: 360px;
            padding: 38px;
            background: #132b43;
            border: 1px solid #254761;
            border-radius: 16px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.4);
            text-align: center;
        }

        .logo {
            font-size: 42px;
            color: #35d6e8;
            margin-bottom: 12px;
        }

        h2 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9bb0c5;
            font-size: 13px;
            margin-bottom: 28px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 16px;
            border: 1px solid #35536d;
            border-radius: 7px;
            background: #0b1e31;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #35d6e8;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #18b9d0;
            color: #061522;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #42d9e8;
        }

        #error {
            color: #ff7777;
            font-size: 13px;
            margin-top: 14px;
        }

        .footer {
            color: #718ba3;
            font-size: 11px;
            margin-top: 25px;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <div class="logo">🛡</div>

        <h2>SentinelShield</h2>
        <p class="subtitle">Vehicle Security Monitoring System</p>

        <form id="loginForm">
            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">LOGIN</button>
            <p id="error"></p>
        </form>

        <p class="footer">SECURE MONITORING SYSTEM © 2026</p>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit",
            function(event) {
                event.preventDefault();

                const username =
                    document.getElementById("username").value;

                const password =
                    document.getElementById("password").value;

                if (username === "admin" &&
                    password === "sentinel123") {

                    sessionStorage.setItem("sentinelLoggedIn", "true");

                    window.location.href = "index.html";

                } else {
                    document.getElementById("error").textContent =
                        "Invalid username or password!";
                }
            }
        );
    </script>
</body>
</html>
